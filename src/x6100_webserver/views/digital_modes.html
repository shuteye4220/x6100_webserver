% rebase('base.html', title='Digital modes editor')
<h2 id="modes-title">Digital modes</h2>

<button id="add_mode">Add new</button>
<!-- On a narrow screen the table scrolls sideways by itself, not the page. -->
<div class="table-scroll" role="region" aria-labelledby="modes-title" tabindex="0">
<table id="digital_modes" aria-labelledby="modes-title">
  <thead>
    <tr>
      <th class="name" scope="col">Label</th>
      <th class="freq" scope="col">Freq,<br/>MHz</th>
      <th class="" scope="col">Mode</th>
      <th class="" scope="col">Type</th>
      <th style="min-width: 6em;" scope="col">Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<template id="row-tpl">
  <tr>
    <td></td>
    <td class='freq_cell'></td>
    <td></td>
    <td></td>
    <td class='action-cell'>
      <button class="edit action"><i class="si-edit" aria-hidden="true"></i></button>
      <button class="remove action"><i class="si-trash" aria-hidden="true"></i></button>
      <button class="save action"><i class="si-disk" aria-hidden="true"></i></button>
      <button class="close action"><i class="si-close" aria-hidden="true"></i></button>
    </td>
  </tr>
</template>

<script>

const type_map = {
  0: "FT8",
  1: "FT4",
};

const table_el = $("#digital_modes>tbody")[0];

var addRow = function(at_start=false) {
  let row = document.getElementById("row-tpl").content.querySelector("tr").cloneNode(true);
  if (!at_start) {
    table_el.appendChild(row);
  } else {
    table_el.prepend(row);
  }
  return row;
}

// Each action button says what it does, and to which entry: icons alone
// have no name for a screen reader. `title` shows it on hover.
var labelButtons = function(row, name) {
  for (const [cls, verb] of [["edit", "Edit"], ["remove", "Remove"], ["save", "Save"], ["close", "Cancel editing"]]) {
    const label = `${verb} ${name}`;
    row.find("button." + cls).attr({"aria-label": label, "title": label});
  }
}

// A field for the edit row, named for screen readers (the column
// header only names it visually).
var field = function(tag, label, attrs) {
  const el = document.createElement(tag);
  for (const k in attrs) {
    el[k] = attrs[k];
  }
  el.setAttribute("aria-label", label);
  return el;
}

var fillRow = function(row) {
  let data = row.data();
  let name_td = row.children("td").get(0);
  name_td.textContent = data.label;

  let freq_td = row.children("td").get(1);
  freq_td.textContent = (data.freq / 1000000).toFixed(3);

  let mode_td = row.children("td").get(2);
  const mode_str = mode_map[data.mode];
  mode_td.textContent = mode_str;

  let type_td = row.children("td").get(3);
  const type_str = type_map[data.type];
  type_td.textContent = type_str;

  labelButtons(row, data.label);

  let actions_td = row.children("td:nth-child(5)");
  $('.edit', actions_td).show();
  $('.remove', actions_td).show();
  $('.save', actions_td).hide();
  $('.close', actions_td).hide();
}

// Loads the table; then focuses the Edit button of entry `focus_id`, if
// given, so keyboard users carry on where they were.
var loadData = function (focus_id) {
  $.get('/api/digital_modes', {}, function(data) {
    table_el.innerHTML = "";
    for (const i in data) {
      let row = addRow();
      row.id = data[i].id;
      $(row).data(data[i]);
      fillRow($(row));
    }
    if (focus_id !== undefined) {
      const button = $(table_el).find("tr").filter(function () { return $(this).data().id === focus_id; }).find("button.edit");
      (button.length ? button : $("#add_mode")).trigger("focus");
    }
  });
}

var setEditMode = function(e) {
  let row = $(e.currentTarget).parents("tr");
  for (const r of $(e.currentTarget).parents("tbody").find("tr")) {
    if (r !== row[0]) {
      $(r).find(".action").hide();
    }
  }
  $("#add_mode").prop("disabled", true);

  let data = row.data();
  let cells = row.children();
  // Made as elements, not HTML text: a label with quotes in it stays whole.
  $(cells[0]).empty().append(field("input", "Label", {type: "text", value: data.label}));
  $(cells[1]).empty().append(field("input", "Frequency, MHz", {type: "number", value: data.freq / 1000000, step: "0.001", min: "0"}));

  let mode_td = cells[2];
  let select_el = field("select", "Mode", {});
  $(mode_td).empty().append(select_el);
  for (const key in mode_map) {
    let option = document.createElement('option');
    option.value = key;
    if (key == data.mode) {
      option.selected = true;
    }
    option.innerText = mode_map[key]
    select_el.append(option)
  }

  let type_td = cells[3];
  select_el = field("select", "Type", {});
  $(type_td).empty().append(select_el);
  for (const key in type_map) {
    let option = document.createElement('option');
    option.value = key;
    if (key == data.type) {
      option.selected = true;
    }
    option.innerText = type_map[key]
    select_el.append(option)
  }
  let actions_td = cells[4];
  $('.edit', actions_td).hide();
  $('.remove', actions_td).hide();
  $('.save', actions_td).show();
  $('.close', actions_td).show();

  $(cells[0]).find("input").trigger("focus");
}

var closeEditMode = function(e) {
  let row = $(e.currentTarget).parents("tr");
  let data = row.data();
  if (data.id === null) {
    row.remove();
    $("#add_mode").prop("disabled", false).trigger("focus");
  } else {
    fillRow(row);
    row.find("button.edit").trigger("focus");
  }
  $("#add_mode").prop("disabled", false);
  $(".action.edit, .action.remove").show();
  $(".action.save, .action.close").hide();
}

var saveRow = function(e) {
  let row = $(e.currentTarget).parents("tr");
  let data = row.data();
  let cells = row.children("td");
  let new_data = {
    label: $(cells[0]).find('input')[0].value,
    freq: Math.round($(cells[1]).find('input')[0].value * 1_000_000),
    mode: Number($(cells[2]).find('select')[0].value),
    type: Number($(cells[3]).find('select')[0].value),
  }
  let url, method;
  if (data.id === null) {
    url = "/api/digital_modes";
    method = "PUT"
  } else {
    url = "/api/digital_modes/" + data.id;
    method = "POST"
  }
  $.ajax({
    url: url,
    type: method,
    data: JSON.stringify(new_data),
    contentType: "application/json; charset=utf-8",
    dataType: "json",
    success: function(response) {
      if (response.status == "OK") {
        announce(`${new_data.label} saved.`);
        $("#add_mode").prop("disabled", false);
        // A new entry has no id here: focus goes to "Add new".
        loadData(data.id);
        $(".action").show();
      }
    },
    error: function(xhr, status, error) {
      // The fields stay as typed, to be corrected.
      alert(errorText(xhr, "Saving failed."));
      $(cells[0]).find("input").trigger("focus");
    }
  });
}

var removeRow = function(e) {
  let row = $(e.currentTarget).parents("tr");
  let data = row.data();
  if (confirm(`Remove digital mode "${data.label}"?`) == true) {
    if (data.id === null) {
      // Simple remove
      row.remove();
    } else {
      // Perform request
      $.ajax({
        url: "/api/digital_modes/" + data.id,
        method: "DELETE",
        success: function(result) {
          announce(`${data.label} removed.`);
          loadData(null);
        },
        error: function(xhr) {
          alert(errorText(xhr, `Removing ${data.label} failed.`));
        }
      })
    }
  } else {
    return;
  }
}

$("#add_mode").on("click", function (e) {
  let row = addRow(true);
  row.id = null;
  $(row).data({
    id: null,
    label: "New",
    freq: 14_074_000,
    mode: 3,
    type: 0,
  });
  fillRow($(row));
  let event = {currentTarget: $(row).children()[0]};
  setEditMode(event);
});

$(table_el)
  .on("click", ".edit", setEditMode)
  .on("click", ".remove", removeRow)
  .on("click", ".save", saveRow)
  .on("click", ".close", closeEditMode)
  // In the edit row: Enter saves, Escape cancels.
  .on("keydown", "input, select", function (e) {
    const row = $(e.currentTarget).parents("tr");
    if (e.key === "Enter") {
      e.preventDefault();
      saveRow({currentTarget: row.find("button.save")[0]});
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeEditMode({currentTarget: row.find("button.close")[0]});
    }
  });


loadData();

</script>
